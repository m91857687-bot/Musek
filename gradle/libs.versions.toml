[versions]
agp = "8.13.2"
kotlin = "2.0.21"
composeBom = "2024.09.00"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
datastore = "1.1.1"
appcompat = "1.7.0"
coreKtx = "1.15.0"
room = "2.6.1"
work = "2.10.0"
documentfile = "1.1.0"
